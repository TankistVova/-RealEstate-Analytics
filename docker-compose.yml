services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realestate}
      POSTGRES_USER: ${POSTGRES_USER:-realestate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER:-realestate} -d ${POSTGRES_DB:-realestate}']
      interval: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-realestate}:${POSTGRES_PASSWORD:-local-development-change-me}@db:5432/${POSTGRES_DB:-realestate}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      db: {condition: service_healthy}
    volumes: [backend_state:/state]
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:5173:5173']
    depends_on: [backend]
volumes:
  postgres_data:
  backend_state:
